name: Java SDK 1.0 release

# A v1.* tag publishes that version to Maven Central: a release candidate (v1.0.0-rc.1) right
# away, a final (v1.0.0) once someone approves it. RELEASING.md has the checklist, the secrets
# and the environments this needs.
on:
  push:
    tags:
      # 1.x only. 0.x tags sit on release/0.x and publish to GitHub Packages from that branch's own
      # workflow; this one must never see them.
      - 'v1.*'

permissions:
  contents: read

concurrency:
  # one release at a time: a second tag waits rather than racing the first to Central
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      final: ${{ steps.tag.outputs.final }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # every branch and tag: the checks below ask where this commit is and what else names it
          fetch-depth: 0
          persist-credentials: false

      - name: Read the version from the tag
        id: tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(1\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))(-rc\.([1-9][0-9]*))?$ ]]; then
            echo "$GITHUB_REF_NAME is neither v1.MINOR.PATCH nor v1.MINOR.PATCH-rc.N" >&2
            exit 1
          fi
          version=${GITHUB_REF_NAME#v}
          final=true
          if [ -n "${BASH_REMATCH[4]}" ]; then
            final=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "final=$final" >> "$GITHUB_OUTPUT"
          echo "releasing $version, final: $final"

      - name: Check the tagged commit is on next or main
        run: |
          commit=$(git rev-parse HEAD)
          for branch in next main; do
            if git rev-parse -q --verify "refs/remotes/origin/$branch" >/dev/null \
              && git merge-base --is-ancestor "$commit" "refs/remotes/origin/$branch"; then
              echo "$commit is on $branch"
              exit 0
            fi
          done
          echo "$commit is on neither next nor main: release only what was reviewed and merged" >&2
          exit 1

      - name: Check no other release tag names this commit
        # one commit, one release (NEXT.md, section 9): a final needs a commit of its own after
        # its last candidate, which its release notes give it
        run: |
          tags=$(git tag --points-at HEAD | grep -E '^v[0-9]' || true)
          if [ "$tags" != "$GITHUB_REF_NAME" ]; then
            echo "release tags on this commit:" >&2
            echo "$tags" >&2
            exit 1
          fi

      - name: Check the release notes are there
        # the GitHub Release is made from them once Central has the version; missing then, they
        # would leave a published version without its release
        run: |
          notes=release-notes/$VERSION.md
          if [ ! -s "$notes" ]; then
            echo "$notes is missing or empty" >&2
            exit 1
          fi
        env:
          VERSION: ${{ steps.tag.outputs.version }}

      - name: Check Central does not have this version yet
        # Central never takes a version back. 404 is the one answer that means "not there"; anything
        # else stops the release. The repository shows a version some minutes after the portal
        # publishes it, and for that window the portal itself refuses a version it already has.
        run: |
          for artifact in odds-feed-parent odds-feed; do
            url=https://repo1.maven.org/maven2/gg/oddin/oddsfeed/$artifact/$VERSION/$artifact-$VERSION.pom
            status=$(curl -sS -o /dev/null -w '%{http_code}' "$url") || status="no answer"
            case "$status" in
              404) echo "not on Central: $artifact $VERSION" ;;
              200) echo "$artifact $VERSION is already on Central" >&2; exit 1 ;;
              *) echo "could not tell whether $artifact $VERSION is on Central ($status from $url)" >&2; exit 1 ;;
            esac
          done
        env:
          VERSION: ${{ steps.tag.outputs.version }}

  build:
    name: Build and test
    needs: check
    permissions:
      contents: read
      packages: read
    # the branch CI, unchanged, at the tag's version: what is published passed the same checks
    uses: ./.github/workflows/next.yml
    with:
      revision: ${{ needs.check.outputs.version }}

  approve:
    name: Approve the final release
    needs: [check, build]
    if: needs.check.outputs.final == 'true'
    runs-on: ubuntu-latest
    # The approval is this environment's required reviewers; it holds no secrets. A final goes to
    # every client who updates, and Central cannot take it back.
    environment: maven-central-approval
    steps:
      - name: Approved
        run: echo "$VERSION approved for Maven Central"
        env:
          VERSION: ${{ needs.check.outputs.version }}

  publish:
    name: Sign and publish to Maven Central
    needs: [check, build, approve]
    # a release candidate goes without approval (NEXT.md, section 9); a final waits for it
    if: >-
      !cancelled() && needs.build.result == 'success'
      && (needs.approve.result == 'success'
          || (needs.approve.result == 'skipped' && needs.check.outputs.final == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # holds the portal token and the signing key, and serves v1.* tags only
    environment: maven-central
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check the secrets are set
        # before the build, so a missing one fails here and not halfway through the upload
        run: |
          missing=0
          for name in CENTRAL_TOKEN_USERNAME CENTRAL_TOKEN_PASSWORD MAVEN_GPG_KEY MAVEN_GPG_PASSPHRASE; do
            if [ -z "${!name}" ]; then
              echo "secret $name is not set in the maven-central environment" >&2
              missing=1
            fi
          done
          exit $missing
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: 'maven'
          # the <server> the release profile uploads with; these name environment variables
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD

      - name: Sign and publish
        # The published modules and what they build against: -am adds test-fakes, which odds-feed's
        # tests compile against and which is not published. The whole reactor would fail anyway -
        # the Central plugin refuses system-tests, which has no jar, even when told to skip it.
        # The build job ran the tests on this commit.
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -Prelease -Drevision="$VERSION"
          -Dcentral.autoPublish=true -Dcentral.waitUntil=published
          -DskipTests -pl odds-feed -am deploy
        env:
          VERSION: ${{ needs.check.outputs.version }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Keep the published bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: central-bundle
          path: target/central-publishing/central-bundle.zip
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Fetch the published bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: central-bundle

      - name: Create the release
        # the jar and POM Central has, with their signatures, so the release page and Central agree
        run: |
          unzip -q central-bundle.zip -d bundle
          dir=bundle/gg/oddin/oddsfeed/odds-feed/$VERSION
          files=()
          for name in "odds-feed-$VERSION.jar" "odds-feed-$VERSION.pom"; do
            for file in "$dir/$name" "$dir/$name.asc"; do
              if [ ! -s "$file" ]; then
                echo "the bundle has no $file" >&2
                exit 1
              fi
              files+=("$file")
            done
          done
          prerelease=()
          if [ "$FINAL" != "true" ]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$VERSION" \
            --notes-file "release-notes/$VERSION.md" "${prerelease[@]}" "${files[@]}"
        env:
          VERSION: ${{ needs.check.outputs.version }}
          FINAL: ${{ needs.check.outputs.final }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
