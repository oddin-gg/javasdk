name: Java SDK 1.0 release

# A v1.* tag publishes that version to Maven Central - a release candidate (v1.0.0-rc.1) or a
# final (v1.0.0) - once a second person approves the upload. RELEASING.md has the checklist,
# the secrets, the repository variable (RELEASE_KEY_FINGERPRINT) and the environment this needs.
# The check job refuses a tag whose commit, notes or version are wrong, a pull request that was
# not approved on its final commit, and a signing key that is not fit to sign, before anything
# is built.
on:
  push:
    tags:
      # 1.x only. 0.x tags sit on release/0.x and publish to GitHub Packages from that branch's own
      # workflow; this one must never see them.
      - 'v1.*'

permissions:
  contents: read

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    # pull requests, to ask which one left the tagged commit
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      final: ${{ steps.tag.outputs.final }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # every branch and tag: the checks below ask where this commit is and what else names it
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        id: tag
        # The tag's form, its commit the merge commit of a pull request merged into main
        # and alone, the release notes, no other workflow reacting to tags, and the version not
        # on Central. release-check-test.sh, run by next.yml on every push, holds each of these
        # to its cases. The signing key is checked by the step after this one.
        run: ./scripts/release-check.sh "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check the pull requests were approved
        # Every pull request merged into main since the previous release was approved on GitHub for
        # its final commit, by someone other than its author: the ruleset of main neither dismisses
        # an approval that a later push made stale nor asks for one of the latest push, so a pull
        # request can merge on an approval of an earlier version of itself. Read-only, like the
        # step before; the first release starts from scripts/release-approval-baseline.
        # release-approval-check-test.sh, run by next.yml on every push, holds it to its cases.
        run: ./scripts/release-approval-check.sh "$COMMIT"
        env:
          COMMIT: ${{ steps.tag.outputs.commit }}
          GH_TOKEN: ${{ github.token }}

      - name: Check the signing key
        # The key the upload will sign with is on both keyservers Central reads, with a signing
        # subkey that is not revoked and does not expire within 30 days: found here, before a
        # reviewer is asked, and not by the upload. It needs no secret; the public key is fetched
        # by the primary's fingerprint, the repository variable (RELEASING.md).
        # release-key-check-test.sh, run by next.yml on every push, holds it to its cases.
        run: ./scripts/release-key-check.sh
        env:
          RELEASE_KEY_FINGERPRINT: ${{ vars.RELEASE_KEY_FINGERPRINT }}

  build:
    name: Build and test
    needs: check
    # next.yml runs pull requests' code too, and reads nothing but this repository
    permissions:
      contents: read
    # the branch CI on the checked commit, at the tag's version: what is published passed it
    uses: ./.github/workflows/next.yml
    with:
      revision: ${{ needs.check.outputs.version }}
      commit: ${{ needs.check.outputs.commit }}

  publish:
    name: Sign and publish to Maven Central
    # the default condition: check and build both succeeded
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      # the artifact this attempt keeps its bundle in, for the GitHub Release, which may run in a
      # later attempt than the one whose publish succeeded
      bundle: central-bundle-${{ github.run_attempt }}
    # Publish jobs for one version never overlap: one runs, at most one waits, and a newer run
    # replaces a waiting one. Per version, so a run waiting for its approval holds up no other.
    # What stops a second upload of a version is Central, which refuses one it has, and the
    # check job's lookup there.
    concurrency:
      group: maven-central-${{ github.ref_name }}
      cancel-in-progress: false
    # Holds the portal token and the signing key. Its required reviewers, who cannot approve
    # their own run, are the release's approval, candidates included: GitHub enforces it outside
    # this file, which the tag's commit decides and so cannot be trusted on its own.
    environment: maven-central
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # the commit check accepted and build tested, whatever the tag names by now
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false

      - name: Check the secrets are set
        # this step, the signing key check and the upload are the only ones with the secrets
        # (release-workflow-test.sh)
        id: secrets
        # before the build, so a missing one fails here and not halfway through the upload
        run: |
          missing=0
          for name in CENTRAL_TOKEN_USERNAME CENTRAL_TOKEN_PASSWORD MAVEN_GPG_KEY MAVEN_GPG_PASSPHRASE; do
            if [ -z "${!name}" ]; then
              echo "secret $name is not set in the maven-central environment" >&2
              missing=1
            fi
          done
          exit $missing
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Check the signing key is the one that was checked
        id: signing-key
        # The check job looked at the public key of RELEASE_KEY_FINGERPRINT; what signs is this
        # secret, which nothing else ties to it. It must be the export of that key's subkeys, its
        # primary a stub, with a signing subkey that is neither revoked nor expired. It then asks
        # both keyservers again, now that the approval is given, for the subkey this secret signs
        # with: they must have it, not revoked, not about to expire. Before the build, so that a
        # wrong or stale secret fails here and signs nothing. release-signing-key-check-test.sh,
        # run by next.yml on every push, holds it to its cases.
        run: ./scripts/release-signing-key-check.sh
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          RELEASE_KEY_FINGERPRINT: ${{ vars.RELEASE_KEY_FINGERPRINT }}

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '25'
          distribution: 'corretto'
          # No cache: the build job, which runs far more code without secrets, writes it, and a
          # plugin planted there would run here with the signing key and the token.
          # The <server> the release profile uploads with; these name environment variables.
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD

      - name: Check the tag still names this commit
        # a release can wait days for its approval, and the tag be moved or deleted meanwhile
        run: ./scripts/release-tag-check.sh "$GITHUB_REF_NAME" "$COMMIT"
        env:
          COMMIT: ${{ needs.check.outputs.commit }}

      - name: Sign and publish
        id: upload
        # The published modules and what they build against: -am adds test-fakes, which odds-feed's
        # tests compile against and which is not published. The whole reactor would fail anyway -
        # the Central plugin refuses system-tests, which has no jar, even when told to skip it.
        # The build job ran the tests on this commit.
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -Prelease -Drevision="$VERSION"
          -Dcentral.autoPublish=true -Dcentral.waitUntil=published
          -DskipTests -pl odds-feed -am deploy
        env:
          VERSION: ${{ needs.check.outputs.version }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Keep the published bundle
        # Also after a publish that failed, and a run that was cancelled: the plugin writes the
        # bundle before it uploads, so one whose wait for Central timed out, or was cancelled, still
        # has it, and the release is made from it by hand (RELEASING.md). Nothing is released from a
        # failed run: github-release needs publish to succeed. A step that failed before the build
        # leaves no bundle, hence the warning.
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # one name per attempt, never overwritten: a re-run after a wait that timed out builds
          # another bundle, which Central refuses, and must not replace the first attempt's, the
          # copy of what Central has
          name: central-bundle-${{ github.run_attempt }}
          path: target/central-publishing/central-bundle.zip
          if-no-files-found: warn

  github-release:
    name: GitHub Release
    needs: [check, publish]
    # only once Central has the version, for a release candidate as for a final
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # the commit Central got
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false

      - name: Check the tag still names the published commit
        run: ./scripts/release-tag-check.sh "$GITHUB_REF_NAME" "$COMMIT"
        env:
          COMMIT: ${{ needs.check.outputs.commit }}

      - name: Fetch the published bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # the attempt whose publish succeeded
          name: ${{ needs.publish.outputs.bundle }}

      - name: Create the release
        # a draft with the notes, the jar, the POM and their signatures, then published: an
        # immutable release takes no assets once it is out
        run: ./scripts/release-github.sh
        env:
          VERSION: ${{ needs.check.outputs.version }}
          FINAL: ${{ needs.check.outputs.final }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
