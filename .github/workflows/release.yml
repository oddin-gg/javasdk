name: Java SDK 1.0 release

# A v1.* tag publishes that version to Maven Central: a release candidate (v1.0.0-rc.1) right
# away, a final (v1.0.0) once someone approves it. RELEASING.md has the checklist, the secrets
# and the environments this needs.
on:
  push:
    tags:
      # 1.x only. 0.x tags sit on release/0.x and publish to GitHub Packages from that branch's own
      # workflow; this one must never see them.
      - 'v1.*'

permissions:
  contents: read

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      final: ${{ steps.tag.outputs.final }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # every branch and tag: the checks below ask where this commit is and what else names it
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        id: tag
        # The tag's form, its commit on next or main and alone, the release notes, no other
        # workflow reacting to tags, and the version not on Central. release-check-test.sh, run
        # by next.yml on every push, holds each of these to its cases.
        run: ./scripts/release-check.sh "$GITHUB_REF_NAME"

  build:
    name: Build and test
    needs: check
    permissions:
      contents: read
      packages: read
    # the branch CI, unchanged, at the tag's version: what is published passed the same checks
    uses: ./.github/workflows/next.yml
    with:
      revision: ${{ needs.check.outputs.version }}

  approve:
    name: Approve the final release
    needs: [check, build]
    if: needs.check.outputs.final == 'true'
    runs-on: ubuntu-latest
    # The approval is this environment's required reviewers; it holds no secrets. A final goes to
    # every client who updates, and Central cannot take it back.
    environment: maven-central-approval
    steps:
      - name: Approved
        run: echo "$VERSION approved for Maven Central"
        env:
          VERSION: ${{ needs.check.outputs.version }}

  publish:
    name: Sign and publish to Maven Central
    needs: [check, build, approve]
    # a release candidate goes without approval (NEXT.md, section 9); a final waits for it
    if: >-
      !cancelled() && needs.build.result == 'success'
      && (needs.approve.result == 'success'
          || (needs.approve.result == 'skipped' && needs.check.outputs.final == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # One upload at a time, set here so a final waiting for approval holds nobody up. GitHub
    # keeps one run waiting per group and cancels it when a third arrives: RELEASING.md says
    # to push a tag only once the previous release has finished.
    concurrency:
      group: maven-central
      cancel-in-progress: false
    # holds the portal token and the signing key, and serves v1.* tags only
    environment: maven-central
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # the commit check accepted and build tested, whatever the tag names by now
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false

      - name: Check the secrets are set
        # before the build, so a missing one fails here and not halfway through the upload
        run: |
          missing=0
          for name in CENTRAL_TOKEN_USERNAME CENTRAL_TOKEN_PASSWORD MAVEN_GPG_KEY MAVEN_GPG_PASSPHRASE; do
            if [ -z "${!name}" ]; then
              echo "secret $name is not set in the maven-central environment" >&2
              missing=1
            fi
          done
          exit $missing
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: 'maven'
          # the <server> the release profile uploads with; these name environment variables
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD

      - name: Check the tag still names this commit
        # a final can wait days for its approval, and the tag be moved or deleted meanwhile
        run: ./scripts/release-tag-check.sh "$GITHUB_REF_NAME" "$COMMIT"
        env:
          COMMIT: ${{ needs.check.outputs.commit }}

      - name: Sign and publish
        # The published modules and what they build against: -am adds test-fakes, which odds-feed's
        # tests compile against and which is not published. The whole reactor would fail anyway -
        # the Central plugin refuses system-tests, which has no jar, even when told to skip it.
        # The build job ran the tests on this commit.
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -Prelease -Drevision="$VERSION"
          -Dcentral.autoPublish=true -Dcentral.waitUntil=published
          -DskipTests -pl odds-feed -am deploy
        env:
          VERSION: ${{ needs.check.outputs.version }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Keep the published bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: central-bundle
          path: target/central-publishing/central-bundle.zip
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [check, publish]
    # explicit: the default condition would skip it whenever approve was skipped, for every
    # release candidate, though publish ran
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false

      - name: Check the tag still names the published commit
        run: ./scripts/release-tag-check.sh "$GITHUB_REF_NAME" "$COMMIT"
        env:
          COMMIT: ${{ needs.check.outputs.commit }}

      - name: Fetch the published bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: central-bundle

      - name: Create the release
        # the jar and POM Central has, with their signatures, so the release page and Central agree
        run: |
          unzip -q central-bundle.zip -d bundle
          dir=bundle/gg/oddin/oddsfeed/odds-feed/$VERSION
          files=()
          for name in "odds-feed-$VERSION.jar" "odds-feed-$VERSION.pom"; do
            for file in "$dir/$name" "$dir/$name.asc"; do
              if [ ! -s "$file" ]; then
                echo "the bundle has no $file" >&2
                exit 1
              fi
              files+=("$file")
            done
          done
          prerelease=()
          if [ "$FINAL" != "true" ]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$VERSION" \
            --notes-file "release-notes/$VERSION.md" "${prerelease[@]}" "${files[@]}"
        env:
          VERSION: ${{ needs.check.outputs.version }}
          FINAL: ${{ needs.check.outputs.final }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
