name: Java SDK CI

on:
  pull_request:
    branches:
      - 'main'
      - 'develop'
      - 'release/0.x'
  push:
    branches:
      - 'main'
      - 'develop'
      - 'release/0.x'
    tags:
      # Only 0.x versions. The 1.0 line tags v1.* and publishes to Maven Central from its own
      # workflow; this one must never publish a 1.x version to GitHub Packages.
      - 'v0.*'

jobs:
  build_and_test_library:
    name: Build & Test Library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8 with Gradle Cache
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Build and Install the Library
        run: ./gradlew test jacocoTestReport install
        working-directory: ./library

      - name: Upload to Local Maven Repository
        uses: actions/upload-artifact@v4
        with:
          name: local-maven-repo
          path: ~/.m2/repository

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: library/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: warn

  build_and_test_examples:
    name: Build & Test Examples
    needs: build_and_test_library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8 with Gradle Cache
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Download Local Maven Repository Artifact
        uses: actions/download-artifact@v4
        with:
          name: local-maven-repo
          path: ~/.m2/repository

      - name: Build and Test the Examples
        run: ./gradlew build
        working-directory: ./examples

  check_version:
    name: Check the Version Is Not Published
    if: startsWith(github.ref, 'refs/tags/v0.')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check No Other Release Tag Names This Commit
        # Gradle takes the version from the last tag, so a second tag here could publish a
        # version other than the one checked below
        run: |
          tags=$(git tag --points-at HEAD | grep -E '^v[0-9]' || true)
          if [ "$tags" != "$GITHUB_REF_NAME" ]; then
            echo "release tags on this commit:" >&2
            echo "$tags" >&2
            exit 1
          fi

      - name: Check GitHub Packages Does Not Have This Version
        # The registry answers 404 for a version it does not have, and a redirect to the file
        # for one it has. Anything else stops the release: it cannot tell us either way.
        run: |
          version=${GITHUB_REF_NAME#v}
          url=https://maven.pkg.github.com/oddin-gg/javasdk/com/oddin/oddsfeed/odds-feed/$version/odds-feed-$version.pom
          status=$(curl -sS -o /dev/null -w '%{http_code}' -u "$GITHUB_ACTOR:$GITHUB_TOKEN" "$url") || status="no answer"
          case "$status" in
            404) echo "not in GitHub Packages: odds-feed $version" ;;
            200|302) echo "odds-feed $version is already in GitHub Packages" >&2; exit 1 ;;
            *) echo "could not tell whether odds-feed $version is in GitHub Packages ($status from $url)" >&2; exit 1 ;;
          esac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_maven:
    name: Publish to GitHub Packages
    needs: [build_and_test_library, build_and_test_examples, check_version]
    if: startsWith(github.ref, 'refs/tags/v0.')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8 with Gradle Cache
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Publish to GitHub Packages
        run: ./gradlew publish
        working-directory: ./library
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
