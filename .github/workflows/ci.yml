name: Java SDK CI

on:
  pull_request:
    branches:
      - 'main'
      - 'develop'
      - 'release/0.x'
  push:
    branches:
      - 'main'
      - 'develop'
      - 'release/0.x'
    tags:
      # Only 0.x versions. The 1.0 line tags v1.* and publishes to Maven Central from its own
      # workflow; this one must never publish a 1.x version to GitHub Packages.
      - 'v0.*'

jobs:
  build_and_test_library:
    name: Build & Test Library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8 with Gradle Cache
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Build and Install the Library
        run: ./gradlew test jacocoTestReport install
        working-directory: ./library

      - name: Upload to Local Maven Repository
        uses: actions/upload-artifact@v4
        with:
          name: local-maven-repo
          path: ~/.m2/repository

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: library/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: warn

  build_and_test_examples:
    name: Build & Test Examples
    needs: build_and_test_library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8 with Gradle Cache
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Download Local Maven Repository Artifact
        uses: actions/download-artifact@v4
        with:
          name: local-maven-repo
          path: ~/.m2/repository

      - name: Build and Test the Examples
        run: ./gradlew build
        working-directory: ./examples

  test_release_check:
    name: Test the Release Check
    # the check runs on tags alone, so its cases run here, on every push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run the Release Check Against Its Cases
        run: ./scripts/release-check-test.sh

  check_version:
    name: Check the Version Is Not Published
    if: startsWith(github.ref, 'refs/tags/v0.')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the Tag and GitHub Packages
        # before the builds, to fail early; publish_maven runs it again before it publishes
        run: ./scripts/release-check.sh "$GITHUB_REF_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_maven:
    name: Publish to GitHub Packages
    needs: [build_and_test_library, build_and_test_examples, test_release_check, check_version]
    if: startsWith(github.ref, 'refs/tags/v0.')
    runs-on: ubuntu-latest
    # One 0.x publish at a time, so two runs for one version cannot both pass the check before
    # either uploads. The check, inside the group, also refuses a tag GitHub no longer has
    # where this run built it.
    concurrency:
      group: release-0x
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8 with Gradle Cache
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Check the Tag and GitHub Packages Again
        # in this checkout: a tag added since check_version ran would otherwise go unseen
        id: release
        run: ./scripts/release-check.sh "$GITHUB_REF_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        # the version just checked, not one Gradle works out from the tags itself
        run: ./gradlew publish -PreleaseVersion="$VERSION"
        working-directory: ./library
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
