name: Java SDK CI

on:
  pull_request:
    branches:
      - 'main'
      - 'develop'
      - 'release/0.x'
  push:
    branches:
      - 'main'
      - 'develop'
      - 'release/0.x'
    tags:
      # Only 0.x versions. The 1.0 line tags v1.* and publishes to Maven Central from its own
      # workflow; this one must never publish a 1.x version to GitHub Packages.
      - 'v0.*'

jobs:
  build_and_test_library:
    name: Build & Test Library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8 with Gradle Cache
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Build and Install the Library
        run: ./gradlew test jacocoTestReport install
        working-directory: ./library

      - name: Check the Publication Takes the Checked Version
        # publish_maven hands Gradle the version the release check passed, as -PreleaseVersion
        run: ./scripts/release-version-test.sh

      - name: Upload to Local Maven Repository
        uses: actions/upload-artifact@v4
        with:
          name: local-maven-repo
          path: ~/.m2/repository

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: library/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: warn

  build_and_test_examples:
    name: Build & Test Examples
    needs: build_and_test_library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8 with Gradle Cache
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Download Local Maven Repository Artifact
        uses: actions/download-artifact@v4
        with:
          name: local-maven-repo
          path: ~/.m2/repository

      - name: Build and Test the Examples
        run: ./gradlew build
        working-directory: ./examples

  test_release_check:
    name: Test the Release Check
    # the check runs on tags alone, so its cases run here, on every push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run the Release Check Against Its Cases
        run: ./scripts/release-check-test.sh

  check_version:
    name: Check the Version Is Not Published
    if: startsWith(github.ref, 'refs/tags/v0.')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the Tag and GitHub Packages
        # before the builds, to fail early; publish_maven runs it again before it uploads
        id: release
        run: ./scripts/release-check.sh "$GITHUB_REF_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_maven:
    name: Publish to GitHub Packages
    needs: [build_and_test_library, build_and_test_examples, test_release_check, check_version]
    if: startsWith(github.ref, 'refs/tags/v0.')
    runs-on: ubuntu-latest
    # Runs for one version take turns, so two of them - a tag pushed, deleted and pushed again -
    # cannot both pass the check before either uploads. Each version has its own group, so a
    # run for one version never cancels a waiting run for another.
    concurrency:
      group: release-0x-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8 with Gradle Cache
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Build What Will Be Published
        # the compiling and packaging before the check, so that what follows it is the upload
        # (and the POM and metadata files, which Gradle writes in a moment)
        run: ./gradlew assemble -PreleaseVersion="$VERSION"
        working-directory: ./library
        env:
          VERSION: ${{ needs.check_version.outputs.version }}

      - name: Check the Tag and GitHub Packages Again
        # Right before the upload, in this checkout: a tag added, moved or deleted since
        # check_version ran is seen here. This narrows the gap between check and upload to the
        # upload itself; it does not remove it.
        id: release
        run: |
          ./scripts/release-check.sh "$GITHUB_REF_NAME"
          if [ "$(sed -n 's/^version=//p' "$GITHUB_OUTPUT" | tail -n 1)" != "$BUILT" ]; then
            echo "the check now gives another version than the one built, $BUILT" >&2
            exit 1
          fi
        env:
          BUILT: ${{ needs.check_version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        # the version checked, not one Gradle works out from the tags itself; the jars above are
        # up to date, so this uploads
        run: ./gradlew publish -PreleaseVersion="$VERSION"
        working-directory: ./library
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
