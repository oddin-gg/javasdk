# PendingOnNext applies to every test in the module without a scenario naming it: JUnit loads it
# through META-INF/services. The include filter keeps auto-detection to that one class, so an
# extension some other jar on the test classpath registers the same way is not picked up with it.
junit.jupiter.extensions.autodetection.enabled=true
junit.jupiter.extensions.autodetection.include=com.oddin.oddsfeed.systemtests.support.PendingOnNext
