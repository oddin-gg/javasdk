# SHA-256 of the odds-feed jar and POM each sdk.version is expected to resolve to.
#
# The repository order in system-tests/pom.xml asks Central before the packages registry, for
# every coordinate including this one, and nothing is published under com.oddin.oddsfeed on
# Central. That group id cannot be claimed - Central verifies it against a domain that is not
# ours, which is why 1.0 moves to gg.oddin.oddsfeed - so these pins are the control here: a
# substituted artifact fails the build whichever repository served it. The POM is pinned as well
# as the jar because the POM is read first and decides what else ends up on the classpath.
#
# scripts/fetch-sdk.sh downloads both files from the version's public GitHub release (0.0.56 to
# 0.0.58), and from the packages registry only for 0.0.54, which has none; either way these digests
# decide.
#
# Each digest was taken from the artifact the packages registry serves. For 0.0.58 both files are
# byte-identical to the jar and POM attached to the v0.0.58 GitHub release, which were copied from
# the registry, not rebuilt. Its POM differs from 0.0.57's only in the version, and its jar holds the
# classes of the v0.0.58 tag. 0.0.58 adds underage on players and as a status on competitors, waits
# five minutes for a lost snapshot complete, and gives each recovery request a new id.
0.0.58.jar=7806b308abd2bb8ffd8ca4112b6d2d95462d90b40235f41d5d18300169d552f9
0.0.58.pom=ee514e6bb58e790dc42dd8e2e870c81f32619b459e60b99ebe40f6d8d3784ef8

# For 0.0.57 both files are byte-identical to the jar and POM attached to the GitHub release. 0.0.57
# fixes the feed match status mapping (a cancelled match read as Unknown).
0.0.57.jar=0bfcc169ef46620178d18992afefd50a9f90dcda50e8acff0db015163469a4c8
0.0.57.pom=168609d440609cb9064d6aaf1e76c05cae21aa0eda155931d89a73c0d21a7936

# For 0.0.56 both files are
# byte-identical to the jar and POM attached to the GitHub release (the release assets were copied
# from the registry, not rebuilt; the 0.0.x Gradle build is not reproducible). Its classes are the
# ones 0.0.56-rc2 carried, and its POM differs from rc2's only in the version.
0.0.56.jar=634b90c1f7f7c0c50fafd77cbf21620ebea84b4c15661df20f9a42779c057f9c
0.0.56.pom=8291c3bf5d473a421b1a180454c4974637297e807d0617cf7fcc88a5d346b3ca

