# SHA-256 of the odds-feed jar and POM each sdk.version is expected to resolve to.
#
# The repository order in system-tests/pom.xml asks Central before the packages registry, for
# every coordinate including this one, and nothing is published under com.oddin.oddsfeed on
# Central. That group id cannot be claimed - Central verifies it against a domain that is not
# ours, which is why 1.0 moves to gg.oddin.oddsfeed - so these pins are the control here: a
# substituted artifact fails the build whichever repository served it. The POM is pinned as well
# as the jar because the POM is read first and decides what else ends up on the classpath.
#
# Each digest was taken from the artifact the packages registry serves. For 0.0.56-rc2 both files
# were checked against the jar and POM attached to the GitHub release: the POM is byte-identical,
# the jar has identical contents under different zip metadata, because the 0.0.x Gradle build is
# not reproducible.
0.0.56-rc2.jar=39e271ddf49ac2795178a507420d6e5fb6de5261deb4f4b96b775c6cee298569
0.0.56-rc2.pom=98eb7d62178bc434746f9a539d238cbd24589824482209e21a48064f5a2a9191

