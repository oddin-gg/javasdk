# The helper images Testcontainers starts next to the broker, pinned by digest like the broker
# itself. Ryuk removes containers a crashed test run leaves behind; sshd lets the broker reach
# the fake feed's auth server on this machine. When bumping Testcontainers, take the tags from
# its log and the digests from `docker buildx imagetools inspect <image>`.
ryuk.container.image=testcontainers/ryuk:0.14.0@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0
sshd.container.image=testcontainers/sshd:1.3.0@sha256:c50c0f59554dcdb2d9e5e705112144428ae9d04ac0af6322b365a18e24213a6a
