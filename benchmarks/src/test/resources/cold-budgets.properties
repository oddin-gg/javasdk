# The budget of the cold scenario (ColdStartBudgetTest): a restart against the fake API, which
# answers every request after a fixed 50 ms - the latency is injected, so the time is mostly it, not
# the SDK's own work - with generated catalogs above production's size (600 market descriptions and
# 250 sports, both more than the production API lists), the eager entity preload on with English as
# its preload locale, and 200 odds changes of 150 markets for matches nothing is cached for. Each
# callback reads the match's name. Time to caught up runs from the first publish until every
# callback ran and the requests they caused are answered; a first message is one odds change on a
# fresh feed, until its callback has read the match's name and a market's.
#
# Set from a measurement (2026-10-14, Intel Pentium Gold 8505, JDK 25, a Linux box with Docker) with
# room: 3 times the median of 7 runs. Seven runs of the scenario took 3.93 to 3.95 s (median 3.94 s;
# 2.5 to 2.6 s of it after the last publish), with 606 requests, of which at most 10 were answered at
# once; seven runs of the first message took 71 to 161 ms (median 152 ms: the 71 ms runs were the
# ones whose catalogs had loaded before the message). The side-load workers, half the REST
# concurrency limit (8 at the default of 16), shared by summaries and profiles set the pace: 600
# requests of 50 ms on 8 workers are 3.75 s. The figures before the workers followed the limit, with
# four fixed ones, were 7.93 s (606 requests, 7.5 s of pace on 4 workers). A budget is 3 times the
# measurement, not 5: the time is mostly the injected sleep, which a shared runner hardly stretches.
#
# The number of requests is not budgeted here but counted exactly by the test: a summary per match,
# a profile per competitor, each catalog once, nothing else.
#
#   measured             time
#   caught up (200)     3943 ms
#   first message        152 ms
cold.caughtUp.ms=12000
cold.firstMessage.ms=480

# The variant mode (the same restart; each odds change carries 5 more markets, all with a variant of
# its own, and each callback reads the name of every market of its message). A variant market's
# description is one request of its own, made the first time its name is read, on the callback's
# thread: 200 matches of 5 variants are 1000 requests, one after another, so the time is 1000 times
# the latency whatever the catalog's two permits allow. Set the same way, from 7 runs on the same
# box, with the 8 side-load workers: 52.96 to 54.80 s (median 53.22 s), of which 51.5 to 52.4 s after
# the last publish, 1606 requests, at most 9 answered at once, the longest callback 0.31 to 0.35 s,
# the longest single name read 58 to 81 ms, the feed healthy and no health event told. The figure
# with four workers was 53.0 s: the workers' pace is hidden behind the variants'.
#
#   measured             time
#   caught up, variants (200 x 5)   53220 ms
cold.variants.caughtUp.ms=160000
