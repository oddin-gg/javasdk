# The budget per odds change of the SDK's decoder and of the warm path's steps after it, warm, by the
# number of markets in it.
#
# Set from a measurement (2026-10-01, Apple M-series, JDK 25, JAXB on Woodstox) with room: allocation at 1.5 times what
# was measured, which it does not wander from, and time at 5 times, for shared CI runners that are
# slower and noisier. A decoder that allocates half as much again, or becomes several times slower,
# fails. Tighten a number when the code gets faster, so the gain is kept.
#
# No time budget is under 10 us: a step that takes a microsecond or two measures the runner's noise
# as much as the code, and its allocation is the check that holds. BudgetTest keeps to the floor.
#
# A slip back to the JDK's own parser - three times slower - stays within the time budget on purpose,
# since CI runners vary that much; XmlReaderTest in odds-feed holds the decoder to Woodstox instead.
#
#   measured          time        allocated
#   20 markets        57 us         81 KB
#   150 markets      329 us        456 KB
#   500 markets     1123 us       1522 KB
jaxb.20.us=285
jaxb.20.bytes=122000
jaxb.150.us=1650
jaxb.150.bytes=685000
jaxb.500.us=5620
jaxb.500.bytes=2284000

# The warm path's steps after the decode, measured 2026-10-05 on the same machine, with the same room
# and the floor: the cache write's time and the build's of 20 markets are 10 us. The cache write does
# not grow with the markets: it writes the match status only.
#
#   measured          time        allocated
#   cache write        0.4 us        2.5 KB
#   build, 20          1.7 us         16 KB
#   build, 150        12.8 us        112 KB
#   build, 500        50.0 us        380 KB
cacheWrite.20.us=10
cacheWrite.20.bytes=3830
cacheWrite.150.us=10
cacheWrite.150.bytes=3830
cacheWrite.500.us=10
cacheWrite.500.bytes=3830
entityBuild.20.us=10
entityBuild.20.bytes=24700
entityBuild.150.us=64
entityBuild.150.bytes=167400
entityBuild.500.us=250
entityBuild.500.bytes=569500
