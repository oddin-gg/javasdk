# The budget per odds change of the SDK's decoder, warm, by the number of markets in it.
#
# Set from a measurement (2026-10-01, Apple M-series, JDK 25, JAXB on Woodstox) with room: allocation at 1.5 times what
# was measured, which it does not wander from, and time at 5 times, for shared CI runners that are
# slower and noisier. A decoder that allocates half as much again, or becomes several times slower,
# fails. Tighten a number when the code gets faster, so the gain is kept.
#
#
# A slip back to the JDK's own parser - three times slower - stays within the time budget on purpose,
# since CI runners vary that much; XmlReaderTest in odds-feed holds the decoder to Woodstox instead.
#
#   measured          time        allocated
#   20 markets        57 us         81 KB
#   150 markets      329 us        456 KB
#   500 markets     1123 us       1522 KB
jaxb.20.us=285
jaxb.20.bytes=122000
jaxb.150.us=1650
jaxb.150.bytes=685000
jaxb.500.us=5620
jaxb.500.bytes=2284000
