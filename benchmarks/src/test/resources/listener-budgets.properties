# The budget of SlowListenerTest (the benchmarks module): while one session's listener takes 50 ms a
# message and falls behind by seconds, how long a message of the other session may wait in the SDK
# (from the broker client taking it to its callback starting) and how deep its queue may get.
#
# Set from a measurement (2026-10-14, Intel Pentium Gold 8505, JDK 25, a Linux box with Docker): the
# other session waited at most 4 ms (p99 3 ms) with a queue of 1, against 33 ms (p99 9 ms) with
# nothing slow - the first messages of a run, before the JIT - while the slow session waited up to 8 s
# with its queue at 158 of a prefetch of 200. The budgets are 250 ms and a queue of 20: far above what a
# session that is not blocked needs on a shared runner, and far below the seconds a session blocked
# behind its neighbour's listener would wait.
slow.otherSession.waitMax.ms=250
slow.otherSession.waitP99.ms=250
slow.otherSession.queuePeak=20
